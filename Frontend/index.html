<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <script src="script.js"></script>

    <h1>Cadastro de Paciente</h1>
    <label>Nome: </label>
    <input type="text" id="nome_paciente" placeholder="Digite o paciente">
    <br>
    <label>Cpf: </label>
    <input type="text" id="cpf" placeholder="Digite seu Cpf">
    <br>
    <label>Data de Nascimento: </label>
    <input type="date" id="data_nascimento" placeholder="Digite sua data de nascimento">
    <br>
    <label>Telefone: </label>
    <input type="text" id="telefone" placeholder="Digite seu telefone">
    <br>
    <label>Endereço: </label>
    <input type="text" id="endereco" placeholder="Digite seu endereço">
    <hr>
    <ul id="lista"></ul>
    <button onclick="listarPaciente()"> Listar </button>
    <button onclick="cadastarPaciente()"> Cadastrar </button>

    <link rel="medico" href="medico.html">
    <link rel="consultas" href="consultas.html">
</body>
</html>
