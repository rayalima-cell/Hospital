<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital</title>
</head>
<body>
    
    <script src="script.js"></script>

    <h1>Cadastro de Paciente</h1>
    <label>Nome: </label>
    <input type="text" id="nome" placeholder="Digite o paciente">
    <br>
    <label>Cpf: </label>
    <input type="text" id="cpf" placeholder="Digite seu Cpf">
    <br>
    <label>Data de Nascimento: </label>
    <input type="date" id="data_nascimento" placeholder="Digite sua data de nascimento">
    <br>
    <label>Telefone: </label>
    <input type="text" id="telefone" placeholder="Digite seu telefone">
    <br>
    <label>Endereço: </label>
    <input type="text" id="endereco" placeholder="Digite seu endereço">
    <hr>
    <ul id="lista"></ul>
    <button onclick="listarPaciente()"> Listar </button>
    <button onclick="cadastarPaciente()"> Cadastrar </button>

    <br>
    <hr>
    <h1>Cadastro de Médico</h1>
    <label>Nome: </label>
    <input type="text" id="nome" placeholder="Digite o Médico">
    <br>
    <label>Telefone: </label>
    <input type="text" id="telefone" placeholder="Digite o telefone">
    <br>

    <label>Especialidade: </label>
    <input type="text" id="especialidade" placeholder="Digite a especialidade">
    <br>

    <button onclick="listarMedicos()"> Listar </button>
    <button onclick="cadastrarMedicos()">Cadastrar</button>

    <ul id="lista2"></ul>
    <hr>

    <br>

    <h1>Cadastro de Consultas</h1>
    <label>ID do Paciente: </label>
    <input type="text" id="id_paciente" placeholder="Digite o ID do paciente">
    <br>
    <label>ID do Médico: </label>
    <input type="text" id="id_medico" placeholder="Digite o ID do médico">
    <br>
    <label>Horario: </label>
    <input type="time" id="horario" placeholder="Digite o horário da consulta">
    <br>
    <label>Motivo: </label>
    <input type="text" id="motivo" placeholder="Digite o motivo da consulta">
    <br>
    <button onclick="listarConsultas()"> Listar </button>
    <button onclick="cadastrarConsulta()"> Cadastrar </button>
    <ul id="lista3"></ul>
    <hr>
</body>
</html>
